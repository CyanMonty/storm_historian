version: 2

seeds:
  - name: zip_county_crosswalk
    description: >
      ZIP Code Tabulation Area (ZCTA) to county FIPS crosswalk derived from the
      U.S. Census Bureau 2020 ZCTA-to-County Relationship File.

      Source: https://www2.census.gov/geo/docs/maps-data/data/rel2020/zcta520/tab20_zcta520_county20_natl.txt

      ZCTAs are Census approximations of USPS ZIP codes. The relationship is
      many-to-many — a single ZCTA can span multiple counties. Use area_ratio
      to identify the dominant county for a ZIP (area_ratio >= 0.5).

      To join against NOAA storm event data, match county_fips_full against:
        lpad(state_fips::text, 2, '0') || lpad(cz_fips::text, 3, '0')
      where cz_type = 'C' (county-level events only).
    config:
      column_types:
        zip_code: varchar
        county_fips_full: varchar
        state_fips: varchar
        county_fips: varchar
        county_name: varchar
        area_ratio: double
    columns:
      - name: zip_code
        description: "5-digit ZIP Code Tabulation Area (ZCTA), zero-padded"
        tests:
          - not_null
      - name: county_fips_full
        description: "5-digit county FIPS code (2-digit state + 3-digit county), zero-padded"
        tests:
          - not_null
      - name: state_fips
        description: "2-digit state FIPS code, zero-padded"
        tests:
          - not_null
      - name: county_fips
        description: "3-digit county FIPS code within the state, zero-padded"
        tests:
          - not_null
      - name: county_name
        description: "Full county name including type suffix (e.g. 'Jefferson County')"
        tests:
          - not_null
      - name: area_ratio
        description: >
          Fraction of the ZCTA's land area that falls within this county (0.0–1.0).
          Rows with area_ratio >= 0.5 represent the dominant county for the ZIP.
          Sums to <= 1.0 per zip_code (may be < 1.0 if water area is significant).
        tests:
          - not_null
