version: 2

models:
  - name: stg_storm_event_details
    description: "Clean staging model for storm event details (typed, trimmed, normalized)."
    columns:
      - name: event_id
        description: "Unique identifier for the storm event"
        tests:
          - not_null
          - unique
      - name: episode_id
        description: "Identifier linking related events in the same episode"
        tests:
          - not_null:
              config:
                severity: warn  # Pre-2006 NOAA records do not have episode IDs; null is expected
      - name: begin_date_time
        description: "Timestamp when the event began"
        tests:
          - not_null
      - name: end_date_time
        description: "Timestamp when the event ended"
      - name: event_type
        description: "Type of storm event (e.g., Tornado, Flood)"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Tornado', 'Hail', 'Thunderstorm Wind', 'Flash Flood', 'Flood', 
                        'High Wind', 'Lightning', 'Heavy Rain', 'Winter Storm', 'Hurricane',
                        'Tropical Storm', 'Ice Storm', 'Drought', 'Heat', 'Wildfire', 
                        'Dense Fog', 'Funnel Cloud', 'Waterspout', 'Strong Wind', 'Blizzard',
                        'Winter Weather', 'Heavy Snow', 'Excessive Heat', 'Extreme Cold/Wind Chill',
                        'Frost/Freeze', 'Cold/Wind Chill', 'Coastal Flood', 'Lakeshore Flood',
                        'Debris Flow', 'Dust Storm', 'Sleet', 'Avalanche', 'Marine Hail',
                        'Marine High Wind', 'Marine Strong Wind', 'Marine Thunderstorm Wind',
                        'Astronomical Low Tide', 'Dense Smoke', 'Dust Devil', 'Freezing Fog',
                        'High Surf', 'Lake-Effect Snow', 'Marine Dense Fog', 'Marine Hurricane/Typhoon',
                        'Marine Tropical Depression', 'Marine Tropical Storm', 'Rip Current',
                        'Seiche', 'Sneakerwave', 'Storm Surge/Tide', 'Tropical Depression',
                        'Tsunami', 'Volcanic Ash', 'Northern Lights']
              config:
                severity: warn  # warn instead of error for new event types
      - name: state
        description: "Two-letter state abbreviation"
        tests:
          - not_null:
              config:
                severity: warn  # Rare NOAA records missing state; 1 known row in source data
      - name: state_fips
        description: "FIPS code for the state"
        tests:
          - not_null:
              config:
                severity: warn  # Rare NOAA records missing state_fips; 1 known row in source data
      - name: year
        description: "Year of the event"
        tests:
          - not_null
          - dbt_utils.accepted_range:
                  arguments:
                    min_value: 1950
                    max_value: 2030
      - name: injuries_direct
        description: "Number of direct injuries"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: injuries_indirect
        description: "Number of indirect injuries"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: deaths_direct
        description: "Number of direct deaths"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: deaths_indirect
        description: "Number of indirect deaths"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: tor_f_scale
        description: "Fujita scale rating for tornadoes"
        tests:
          - accepted_values:
              arguments:
                values: ['EF0', 'EF1', 'EF2', 'EF3', 'EF4', 'EF5', 
                        'F0', 'F1', 'F2', 'F3', 'F4', 'F5']
              config:
                severity: warn

  - name: stg_storm_event_fatalities
    description: "Clean staging model for storm event fatalities (typed, trimmed, normalized)."
    columns:
      - name: fatality_id
        description: "Unique identifier for the fatality record"
        tests:
          - not_null
          - unique:
              config:
                severity: warn  # NOAA fatality_id is not globally unique across annual extract files
      - name: event_id
        description: "Foreign key to storm event"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_storm_event_details')
                field: event_id
      - name: fatality_type
        description: "Type of fatality (Direct or Indirect)"
        tests:
          - accepted_values:
              arguments:
                values: ['Direct', 'Indirect']
              config:
                severity: warn
      - name: fatality_age
        description: "Age of the deceased"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 130
                inclusive: true
      - name: fatality_sex
        description: "Sex of the deceased"
        tests:
          - accepted_values:
              arguments:
                values: ['M', 'F']
              config:
                severity: warn

  - name: stg_storm_event_locations
    description: "Clean staging model for storm event location points."
    columns:
      - name: event_id
        description: "Foreign key to storm event"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_storm_event_details')
                field: event_id
              config:
                severity: warn  # ~0.3% of location records reference events absent from details (known NOAA artifact)
      - name: location_index
        description: "Sequential index for multiple locations per event"
      - name: latitude
        description: "Latitude coordinate"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -90
                max_value: 90
                inclusive: true
              config:
                severity: warn  # 1 known NOAA row with out-of-range latitude; source data artifact
      - name: longitude
        description: "Longitude coordinate"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: -180
                max_value: 180
                inclusive: true
