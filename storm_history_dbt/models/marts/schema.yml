version: 2

models:
  - name: dim_locations
    description: "Dimension table for geographic locations (states and counties/zones)"
    config:
      meta:
        model_type: dimension
    columns:
      - name: location_key
        description: >
          Surrogate key for the location dimension, derived from
          state_fips + cz_type + cz_fips. cz_type is included because NOAA
          namespaces FIPS codes separately for counties (C) and forecast zones
          (Z)—the same FIPS number can refer to different geographies.
        tests:
          - not_null
          - unique
      - name: state
        description: "Two-letter state abbreviation"
        tests:
          - not_null
      - name: state_fips
        description: "FIPS code for the state (1-99)"
        tests:
          - not_null
      - name: cz_type
        description: "County/Zone type: C=County, Z=Forecast Zone, M=Marine"
        tests:
          - accepted_values:
              arguments:
                values: ['C', 'Z', 'M']
              config:
                severity: warn
      - name: cz_fips
        description: "FIPS code for county/zone"
      - name: cz_name
        description: "Name of the county or forecast zone"
      - name: cz_timezone
        description: "Timezone for the location"

  - name: dim_event_types
    description: "Dimension table for storm event types with categorization"
    config:
      meta:
        model_type: dimension
    columns:
      - name: event_type_key
        description: "Surrogate key for the event type dimension"
        tests:
          - not_null
          - unique
      - name: event_type
        description: "Specific storm event type (e.g., Tornado, Hail)"
        tests:
          - not_null
          - unique
      - name: event_category
        description: "High-level category grouping event types"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Tornado/Funnel', 'Wind', 'Hail', 'Flood', 'Winter Weather', 
                        'Tropical', 'Lightning', 'Fire', 'Temperature Extreme', 'Other']

  - name: fct_storm_events
    description: "Core fact table for storm events with all metrics and denormalized dimensions"
    config:
      meta:
        model_type: fact
        grain: "One row per storm event_id"
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "end_date_time >= begin_date_time or end_date_time is null"
            name: end_date_after_begin_date
      - dbt_utils.expression_is_true:
          arguments:
            expression: "total_damage_amount >= 0 or total_damage_amount is null"
            name: total_damage_non_negative
    columns:
      - name: event_id
        description: "Primary key - unique identifier for the storm event"
        tests:
          - not_null
          - unique
      - name: episode_id
        description: "Identifier linking related events in the same episode"
        tests:
          - not_null:
              config:
                severity: warn  # Pre-2006 NOAA records have no episode_id; null is expected (~230k rows)
      - name: location_key
        description: "Foreign key to dim_locations"
        tests:
          - relationships:
              arguments:
                to: ref('dim_locations')
                field: location_key
              config:
                severity: warn  # Some locations may not join due to data quality
      - name: event_type_key
        description: "Foreign key to dim_event_types"
        tests:
          - relationships:
              arguments:
                to: ref('dim_event_types')
                field: event_type_key
      - name: begin_date_time
        description: "Timestamp when the event began"
        tests:
          - not_null
      - name: end_date_time
        description: "Timestamp when the event ended"
      - name: event_type
        description: "Type of storm event"
        tests:
          - not_null
      - name: state
        description: "Two-letter state abbreviation"
        tests:
          - not_null:
              config:
                severity: warn  # 1 known NOAA row with null state; propagated from source
      - name: year
        description: "Year of the event"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1950
                max_value: 2030
      - name: total_injuries
        description: "Sum of direct and indirect injuries"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: total_deaths
        description: "Sum of direct and indirect deaths"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: damage_property_amount
        description: "Property damage in USD (parsed from K/M/B format)"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: damage_crops_amount
        description: "Crop damage in USD (parsed from K/M/B format)"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: total_damage_amount
        description: "Total property + crop damage in USD"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: tor_f_scale
        description: "Fujita/Enhanced Fujita scale rating for tornadoes"
      - name: tor_length
        description: "Tornado path length in miles"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: tor_width
        description: "Tornado path width in yards"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: location_point_count
        description: "Count of location points associated with this event"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: fatality_record_count
        description: "Count of fatality records associated with this event"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: has_suspect_longitude
        description: "True if any location point for this event had a positive (sign-flipped) longitude in NOAA source"
      - name: has_duplicate_fatality_ids
        description: "True when NOAA duplicate extract rows are present for this event's fatalities"

  - name: fct_fatalities
    description: "Fact table for individual storm event fatalities"
    config:
      meta:
        model_type: fact
        grain: "One row per fatality_id"
    columns:
      - name: fatality_id
        description: "Primary key - unique identifier for the fatality record"
        tests:
          - not_null
          - unique
      - name: event_id
        description: "Foreign key to fct_storm_events"
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_storm_events')
                field: event_id
      - name: event_type_key
        description: "Foreign key to dim_event_types"
        tests:
          - relationships:
              arguments:
                to: ref('dim_event_types')
                field: event_type_key
              config:
                severity: warn
      - name: episode_id
        description: "Storm episode identifier from parent event"
      - name: event_type
        description: "Type of storm event that caused the fatality"
        tests:
          - not_null
      - name: state
        description: "State where fatality occurred"
        tests:
          - not_null
      - name: fatality_date_time
        description: "Timestamp of the fatality"
      - name: fatality_type
        description: "Direct or Indirect fatality"
        tests:
          - accepted_values:
              arguments:
                values: ['Direct', 'Indirect']
              config:
                severity: warn
      - name: fatality_age
        description: "Age of the deceased"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 130
                inclusive: true
      - name: fatality_sex
        description: "Sex of the deceased (M/F)"
        tests:
          - accepted_values:
              arguments:
                values: ['M', 'F']
              config:
                severity: warn
      - name: fatality_location
        description: "Description of where the fatality occurred"

  - name: agg_events_by_state_year
    description: "Pre-aggregated metrics by state and year for performance"
    config:
      meta:
        model_type: aggregate
        grain: "One row per state per year"
    columns:
      - name: state
        description: "Two-letter state abbreviation"
        tests:
          - not_null
      - name: state_fips
        description: "FIPS code for the state"
        tests:
          - not_null
      - name: year
        description: "Year of events"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1950
                max_value: 2030
      - name: total_events
        description: "Count of storm events in this state/year"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: total_injuries
        description: "Sum of all injuries (direct + indirect)"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: total_deaths
        description: "Sum of all deaths (direct + indirect)"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true
      - name: total_damage_millions
        description: "Total damage in millions of USD"
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

  - name: dim_zip_codes
    description: >
      Dimension table for ZIP codes (ZCTAs). Grain: one row per ZIP code.
      Each ZIP is mapped to its dominant county (highest Census land area_ratio).
      The location_key FK is valid only for county-level NOAA entries (cz_type = 'C');
      null means no NOAA events exist for the dominant county of that ZIP.
    config:
      meta:
        model_type: dimension
    columns:
      - name: zip_key
        description: "Surrogate key for the ZIP code dimension"
        tests:
          - not_null
          - unique
      - name: zip_code
        description: "5-digit ZIP Code Tabulation Area (ZCTA), zero-padded"
        tests:
          - not_null
          - unique
      - name: county_fips_full
        description: "5-digit FIPS of dominant county (state 2 + county 3)"
        tests:
          - not_null
      - name: state_fips
        description: "2-digit state FIPS code, zero-padded"
        tests:
          - not_null
      - name: county_fips
        description: "3-digit county FIPS code, zero-padded"
        tests:
          - not_null
      - name: county_name
        description: "Full county name (e.g. 'Jefferson County')"
        tests:
          - not_null
      - name: dominant_county_area_ratio
        description: "Fraction of the ZIP's land area in the dominant county (0.0–1.0)"
      - name: counties_in_zip
        description: "Total number of counties this ZIP overlaps"
      - name: is_multi_county
        description: "True when the ZIP spans more than one county"
      - name: location_key
        description: "FK to dim_locations; null when dominant county has no NOAA events on record"
      - name: state_abbr
        description: "Two-letter state abbreviation from dim_locations"

  - name: agg_events_by_zip
    description: >
      Pre-aggregated storm event metrics by ZIP code. Grain: one row per zip_code.
      County-level NOAA events (cz_type='C') are expanded to all overlapping ZIPs
      via the Census crosswalk — a single event appears in every ZIP whose county
      it occurred in. Zone and Marine events are excluded (unmappable to ZIP).
    config:
      meta:
        model_type: aggregate
        grain: "One row per zip_code"
    columns:
      - name: zip_code
        description: "5-digit ZIP Code Tabulation Area"
        tests:
          - not_null
          - unique
      - name: county_fips_full
        description: "5-digit FIPS of the county associated with this ZIP in the crosswalk"
        tests:
          - not_null
      - name: total_events
        description: "Total county-level NOAA events mapped to this ZIP"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1
                inclusive: true
      - name: total_injuries
        description: "Sum of all injuries across events in this ZIP"
      - name: total_deaths
        description: "Sum of all deaths across events in this ZIP"
      - name: total_damage_millions
        description: "Total property + crop damage in millions of USD"
      - name: max_tornado_severity
        description: "Highest tornado severity score (0–10 ordinal mapping F/EF scale)"
      - name: last_updated
        description: "Latest etl_inserted_at from source events"
